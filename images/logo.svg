<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="neonGlowLogo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="brandTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <rect width="1000" height="320" rx="24" fill="url(#logoBgGrad)" />

  <!-- Blueprint Grid -->
  <g stroke="rgba(56, 189, 248, 0.06)" stroke-width="1.2">
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="160" x2="1000" y2="160" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="160" y1="0" x2="160" y2="320" />
    <line x1="320" y1="0" x2="320" y2="320" />
    <line x1="480" y1="0" x2="480" y2="320" />
  </g>

  <!-- Left Icon Emblem -->
  <g transform="translate(60, 45) scale(0.45)">
    <!-- Floor Polygons -->
    <polygon points="120,310 256,230 392,310 256,390" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Exterior Isometric Walls -->
    <polygon points="120,310 120,250 256,170 256,230" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round" filter="url(#neonGlowLogo)" />
    <polygon points="256,230 256,170 392,250 392,310" fill="rgba(30, 41, 59, 0.85)" stroke="#0284c7" stroke-width="5" stroke-linejoin="round" filter="url(#neonGlowLogo)" />

    <!-- Front Left Wall -->
    <polygon points="120,310 120,250 200,298 200,358" fill="rgba(30, 41, 59, 0.9)" stroke="#38bdf8" stroke-width="4.5" stroke-linejoin="round" />
    <!-- Front Right Wall -->
    <polygon points="200,358 200,298 256,330 256,390" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Interior Partitions -->
    <line x1="180" y1="215" x2="256" y2="260" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <line x1="256" y1="260" x2="330" y2="215" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <line x1="256" y1="260" x2="256" y2="330" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />

    <!-- Smart Home Nodes -->
    <line x1="195" y1="255" x2="235" y2="280" stroke="#f59e0b" stroke-width="3" stroke-dasharray="3,3" />
    <circle cx="195" cy="255" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="2.5" filter="url(#neonGlowLogo)" />
    <line x1="235" y1="280" x2="295" y2="245" stroke="#38bdf8" stroke-width="3" stroke-dasharray="3,3" />
    <circle cx="235" cy="280" r="11" fill="#06b6d4" stroke="#ffffff" stroke-width="3" filter="url(#neonGlowLogo)" />
    <circle cx="295" cy="245" r="9" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5" filter="url(#neonGlowLogo)" />

    <!-- Compass -->
    <g transform="translate(345, 80) scale(1.2)">
      <circle cx="0" cy="25" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="5" />
      <circle cx="0" cy="25" r="7" fill="#38bdf8" />
      <line x1="-5" y1="36" x2="-35" y2="135" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" />
      <line x1="5" y1="36" x2="35" y2="135" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" />
      <path d="M -22 85 Q 0 95 22 85" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="2,2" />
      <circle cx="0" cy="91" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
    </g>
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(340, 135)">
    <!-- Main Title -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-1">
      Home <tspan fill="#38bdf8">Architect</tspan>
    </text>

    <!-- Subtitle -->
    <text x="5" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      Smart CAD Floorplan Studio for Home Assistant
    </text>

    <!-- Badges -->
    <g transform="translate(5, 75)">
      <rect x="0" y="0" width="95" height="30" rx="15" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
      <text x="47" y="19" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">STUDIO</text>

      <rect x="110" y="0" width="90" height="30" rx="15" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />
      <text x="155" y="19" font-family="monospace" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">v1.0.18</text>

      <rect x="215" y="0" width="85" height="30" rx="15" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" />
      <text x="257" y="19" font-family="monospace" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle">HACS</text>
    </g>
  </g>
</svg>
